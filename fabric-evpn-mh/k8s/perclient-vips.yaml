---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: perclient-vips
  labels:
    purpose: perclient-steering
spec:
  blocks:
    - cidr: 192.168.202.3/32   # client-1  -> steered to DC1
    - cidr: 192.168.202.4/32   # external-client-2 -> steered to DC2
---
apiVersion: v1
kind: Service
metadata:
  name: dc-demo-cli1
  namespace: demo
  labels:
    app: dc-demo
    client-ep: cli1
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.202.3
  externalTrafficPolicy: Cluster
  selector:
    app: dc-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dc-demo-cli2
  namespace: demo
  labels:
    app: dc-demo
    client-ep: cli2
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.202.4
  externalTrafficPolicy: Cluster
  selector:
    app: dc-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
