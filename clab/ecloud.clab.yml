    k8s-master-2:
      kind: linux
      mgmt-ipv4: 172.29.129.34
      group: dc1-hosts
    k8s-master-3:
      kind: linux
      mgmt-ipv4: 172.29.129.35
      group: dc1-hosts
    k8s-woker-1:
      kind: linux
      mgmt-ipv4: 172.29.129.36
      group: dc1-hosts
    k8s-woker-2:
      kind: linux
      mgmt-ipv4: 172.29.129.37
      group: dc1-hosts
    k8s-woker-3:
      kind: linux
      mgmt-ipv4: 172.29.129.38
      group: dc1-hosts
    service-node-dns-ntp:
      kind: linux
      mgmt-ipv4: 172.29.129.39
      group: dc1-hosts
    client-1:
      kind: linux
      mgmt-ipv4: 172.29.129.40
      group: clients
    external-client-2:
      kind: linux
      mgmt-ipv4: 172.29.129.41
      group: clients
    gobgp-1:
