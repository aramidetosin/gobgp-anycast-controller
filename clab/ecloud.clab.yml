      group: dc1
      startup-config: bootstrap/leaf-service-1.cfg   # applied at FIRST BOOT by the patched launcher
    leaf-service-2:
      kind: nvidia_cumulusvx
      mgmt-ipv4: 172.29.129.18
      group: dc1
      startup-config: bootstrap/leaf-service-2.cfg   # applied at FIRST BOOT by the patched launcher
    leaf-border-1:
      kind: nvidia_cumulusvx
      mgmt-ipv4: 172.29.129.19
      group: dc1
      startup-config: bootstrap/leaf-border-1.cfg   # applied at FIRST BOOT by the patched launcher
    leaf-border-2:
      kind: nvidia_cumulusvx
      mgmt-ipv4: 172.29.129.20
      group: dc1
